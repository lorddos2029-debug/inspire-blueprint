name: Assemble kit cobre leito images

on:
  push:
    paths:
      - ".tmp-kit-upload/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact product image set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kit-cobre-leito
          cat .tmp-kit-upload/chunk-* | base64 -d > /tmp/kit-cobre-leito/images.tar.gz
          echo "3841792f5dedbfde8761cfee9eb1ae7b9d0a7777db44ad7cc25cc757a2d0bae8  /tmp/kit-cobre-leito/images.tar.gz" | sha256sum -c -
          mkdir -p /tmp/kit-cobre-leito/src
          tar -xzf /tmp/kit-cobre-leito/images.tar.gz -C /tmp/kit-cobre-leito/src
          mkdir -p public/assets/products-bc/kit-cobre-leito-piquet
          cp /tmp/kit-cobre-leito/src/*.webp public/assets/products-bc/kit-cobre-leito-piquet/

      - name: Commit product images
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-kit-upload
          rm -f .github/workflows/assemble-kit-cobre-leito-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona imagens enviadas do kit cobre leito"
          git push
