name: Import kit review photos
on:
  push:
    branches: [main]
    paths: [".github/workflows/import-kit-review-photos.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add photos
        run: |
          set -euo pipefail
          mkdir -p public/assets/products-bc/kit-cobre-leito-piquet/reviews /tmp/kitreviews
          cat > /tmp/kitreviews.tar.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/kitreviews.tar.gz.b64 > /tmp/kitreviews.tar.gz
          tar -xzf /tmp/kitreviews.tar.gz -C /tmp/kitreviews
          cp /tmp/kitreviews/kit-review-*.jpg public/assets/products-bc/kit-cobre-leito-piquet/reviews/
          ls -lh public/assets/products-bc/kit-cobre-leito-piquet/reviews
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/products-bc/kit-cobre-leito-piquet/reviews
          git commit -m "feat: add kit cobre leito review photos"
          git push
